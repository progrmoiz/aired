name = "aired"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web"
# Worker handles routing first; static assets accessed via env.ASSETS.fetch
# in the notFound handler. Required so /dashboard and other auth-gated
# routes can run their handler before the static asset is served.
run_worker_first = true
binding = "ASSETS"
# Unknown paths get apps/web/404.html with a 404 status, both when the
# notFound handler passes a request on and when a route fetches it.
not_found_handling = "404-page"

[[r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "aired-pages"

[[kv_namespaces]]
binding = "PAGES_KV"
id = "6388d6b3b6c04fe5ad8529ae029e723e"

# Accounts and billing state (users, identities, subscriptions, billing_events).
# Owner: run `wrangler d1 create aired` and paste the returned id below.
# Local dev/tests: `wrangler d1 migrations apply aired --local`.
[[d1_databases]]
binding = "DB"
database_name = "aired"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Per-minute flood guards for anonymous traffic, counted by Cloudflare per
# location (no KV writes). The hourly limits live in middleware/rate-limit.ts.
# Real spam ran at most 2 publishes a minute, so 6 only catches floods.
[[ratelimits]]
name = "PUBLISH_BURST"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "REPORT_BURST"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# PIN guesses: 10 a minute per page and visitor (an IPv6 visitor counts by
# /64), and 60 a minute per page, both counted per Cloudflare location
# (src/lib/pin-guess.ts). The global cap is in D1: 30 wrong PINs in 15
# minutes locks entry on that page (src/lib/pin-failures.ts).
[[ratelimits]]
name = "PIN_GUESS"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PIN_GUESS_PAGE"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

# Custom domain
[[routes]]
pattern = "aired.sh/*"
zone_name = "aired.sh"

[[routes]]
pattern = "aired.sh"
zone_name = "aired.sh"

# Expired-page file cleanup (src/lib/expired-sweep.ts): 40 files every 5
# minutes (11,520 a day). A file goes after two sightings a day or more
# apart, so deletion takes about two passes; the run logs each pass's length
# (expired_sweep_pass_done) to check against the privacy policy's 30 days.
[triggers]
crons = ["*/5 * * * *"]
