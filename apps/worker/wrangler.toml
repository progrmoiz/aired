name = "aired"
main = "src/index.ts"
compatibility_date = "2025-04-01"
# global_fetch_strictly_public: outbound fetches never reach this zone's own
# origin. Required by the MCP OAuth server to fetch client metadata documents
# (CIMD) safely.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# Workers Logs: every console.* call and one invocation log per request are
# kept and queryable in the dashboard (Workers > aired > Logs). Objects from
# lib/log.ts are indexed by field, so filter on event or requestId. All
# requests are kept (head_sampling_rate = 1); lower it if volume gets
# expensive. Alerts and limits: docs/observability.md.
[observability]
enabled = true
head_sampling_rate = 1

# Build the signed-in dashboard (apps/dashboard, React + shadcn/ui) into
# ../web/dashboard.html and ../web/dashboard-assets/ before every `wrangler dev`
# and `wrangler deploy`, so a deploy can never ship a stale or missing dashboard.
[build]
command = "pnpm --filter @aired/ui-tokens sync && pnpm --filter @aired/dashboard build"

[assets]
directory = "../web"
# Worker handles routing first; static assets accessed via env.ASSETS.fetch
# in the notFound handler. Required so /dashboard and other auth-gated
# routes can run their handler before the static asset is served.
run_worker_first = true
binding = "ASSETS"
# Unknown paths get apps/web/404.html with a 404 status, both when the
# notFound handler passes a request on and when a route fetches it.
not_found_handling = "404-page"

[[r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "aired-pages"

[[kv_namespaces]]
binding = "PAGES_KV"
id = "6388d6b3b6c04fe5ad8529ae029e723e"

# The MCP OAuth grant store (routes/mcp-oauth.ts). Same namespace as PAGES_KV:
# its keys are client:, grant:, grants:, token:, tokens: and transaction:,
# none of which aired uses, so no new namespace is needed.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "6388d6b3b6c04fe5ad8529ae029e723e"

# Accounts and billing state (users, identities, subscriptions, billing_events).
# Owner: run `wrangler d1 create aired` and paste the returned id below.
# Local dev/tests: `wrangler d1 migrations apply aired --local`.
[[d1_databases]]
binding = "DB"
database_name = "aired"
database_id = "4581e15e-7f00-408c-a69c-2558584a6d84"
migrations_dir = "migrations"

# Link-preview screenshots (src/lib/og-render.ts): after a publish or update,
# a 1200x630 JPEG of the page goes to R2 next to its HTML and /og/:id serves
# it. Browser Rendering needs no setup on the account beyond this binding and
# the og_shot_budget migration (0008). Workers Free allows 10 minutes a day,
# so screenshots stop at 8 (OG_SHOT_DAILY_SECONDS, a var, overrides it).
# Local `wrangler dev` can't emulate this browser for @cloudflare/puppeteer
# 1.4 (it answers 405, and pages keep the card); to try screenshots locally,
# add `remote = true` below, which uses the account's real browser.
[browser]
binding = "BROWSER"

# Per-minute flood guards for anonymous traffic, counted by Cloudflare per
# location (no KV writes). The hourly limits live in middleware/rate-limit.ts.
# Real spam ran at most 2 publishes a minute, so 6 only catches floods.
[[ratelimits]]
name = "PUBLISH_BURST"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "REPORT_BURST"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# PIN guesses: 10 a minute per page and visitor (an IPv6 visitor counts by
# /64), and 60 a minute per page, both counted per Cloudflare location
# (src/lib/pin-guess.ts). The global cap is in D1: 30 wrong PINs in 15
# minutes locks entry on that page (src/lib/pin-failures.ts).
[[ratelimits]]
name = "PIN_GUESS"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PIN_GUESS_PAGE"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

# CLI device sign-in starts (POST /auth/device): each one writes to D1.
[[ratelimits]]
name = "DEVICE_BURST"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

# MCP OAuth dynamic client registrations (POST /oauth/register): each writes KV.
[[ratelimits]]
name = "OAUTH_BURST"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

# Custom domain
[[routes]]
pattern = "aired.sh/*"
zone_name = "aired.sh"

[[routes]]
pattern = "aired.sh"
zone_name = "aired.sh"

# Expired-page file cleanup (src/lib/expired-sweep.ts): 40 files every 5
# minutes (11,520 a day). A file goes after two sightings a day or more
# apart, so deletion takes about two passes; the run logs each pass's length
# (expired_sweep_pass_done) to check against the privacy policy's 30 days.
[triggers]
crons = ["*/5 * * * *"]

# ---------------------------------------------------------------------------
# Staging: https://staging.aired.sh, deployed with `pnpm deploy:staging`
# (scripts/deploy.sh) or by CI on every push to main. Its own KV namespace,
# R2 bucket, D1 database and rate-limit counters, so nothing it does can touch
# production data. Secrets are set per environment
# (`wrangler secret put NAME --env staging`); see docs/deploy.md.
#
# Wrangler does not copy bindings, vars, routes or triggers into an
# environment, so every one is listed again here. [build], [assets],
# [observability] and the compatibility settings are inherited.
# ---------------------------------------------------------------------------
[env.staging]
name = "aired-staging"
workers_dev = false
# A Custom Domain: `wrangler deploy --env staging` creates the DNS record.
routes = [{ pattern = "staging.aired.sh", custom_domain = true }]

[env.staging.vars]
SITE_ORIGIN = "https://staging.aired.sh"
# Adds X-Robots-Tag: noindex to every response (middleware/staging.ts).
AIRED_ENV = "staging"
# Screenshots share the account's Browser Rendering minutes with production;
# off on staging. Set to e.g. "60" to try them.
OG_SHOT_DAILY_SECONDS = "0"

[[env.staging.r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "aired-pages-staging"

# Owner: `wrangler kv namespace create aired-staging`, paste the id in both.
[[env.staging.kv_namespaces]]
binding = "PAGES_KV"
id = "REPLACE_WITH_STAGING_KV_ID"

[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_STAGING_KV_ID"

# Owner: `wrangler d1 create aired-staging`, paste the id.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "aired-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"

[env.staging.browser]
binding = "BROWSER"

# Same limits as production, separate counters (namespace ids are per
# account, so reusing 1001-1006 would share production's buckets).
[[env.staging.ratelimits]]
name = "PUBLISH_BURST"
namespace_id = "2001"
simple = { limit = 6, period = 60 }

[[env.staging.ratelimits]]
name = "REPORT_BURST"
namespace_id = "2002"
simple = { limit = 3, period = 60 }

[[env.staging.ratelimits]]
name = "PIN_GUESS"
namespace_id = "2003"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "PIN_GUESS_PAGE"
namespace_id = "2004"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "DEVICE_BURST"
namespace_id = "2005"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "OAUTH_BURST"
namespace_id = "2006"
simple = { limit = 5, period = 60 }

# Staging keeps the sweep so expiry is tested end to end, hourly to stay cheap.
[env.staging.triggers]
crons = ["0 * * * *"]
