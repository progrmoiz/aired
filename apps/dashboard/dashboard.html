<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aired — your pages</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/inter-latin-v20.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <script>
    // Theme before first paint (same rule as src/lib/theme.ts).
    try {
      var t = localStorage.getItem('aired-theme');
      if (t !== 'midnight' && t !== 'daylight') t = matchMedia('(prefers-color-scheme: light)').matches ? 'daylight' : 'midnight';
      if (t === 'daylight') { document.documentElement.dataset.theme = 'daylight'; document.documentElement.classList.remove('dark'); }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
