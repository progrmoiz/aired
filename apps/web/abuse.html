<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aired — report abuse</title>
  <meta name="description" content="Report a page on aired.sh that hosts spam, phishing, malware or illegal content." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0a0a0b;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .field {
      width: 100%;
      background: #111113;
      border: 1px solid #222225;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ededef;
      font-size: 0.875rem;
      transition: border-color 120ms ease;
    }
    .field::placeholder { color: #56565a; }
    .field:focus { outline: none; border-color: #3b3b40; box-shadow: 0 0 0 3px rgba(124, 106, 239, 0.25); }
    select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #8a8a8e 50%), linear-gradient(135deg, #8a8a8e 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-aired-text-primary">

  <header class="w-full px-6 h-14 flex items-center justify-between max-w-2xl mx-auto">
    <a href="/" class="text-base font-semibold tracking-tight text-aired-text-primary hover:text-white transition-colors duration-150">aired</a>
    <nav class="flex items-center gap-5 text-sm text-aired-text-secondary">
      <a href="/docs.html" class="hover:text-aired-text-primary transition-colors duration-150">Docs</a>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-xl font-semibold tracking-tight">Report abuse</h1>
    <p class="mt-2 text-sm text-aired-text-secondary">
      Anyone can publish to aired.sh. If a page hosts spam, phishing, malware or illegal content, tell us here and we'll review it and take it down.
    </p>

    <form id="report-form" class="mt-8 flex flex-col gap-5" novalidate>
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">Page link</span>
        <input id="page" name="page" class="field font-mono" type="text" required autocomplete="off" spellcheck="false"
               placeholder="https://aired.sh/p/abc123XYZ0" />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">What's wrong with it?</span>
        <select id="category" name="category" class="field" required>
          <option value="spam">Spam or SEO link farming</option>
          <option value="phishing">Phishing or impersonation</option>
          <option value="malware">Malware or a scam download</option>
          <option value="illegal">Illegal content</option>
          <option value="other">Something else</option>
        </select>
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">Details</span>
        <textarea id="reason" name="reason" class="field" rows="4" maxlength="1000" required
                  placeholder="What does the page do, and who does it target?"></textarea>
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">Your email <span class="text-aired-text-tertiary font-normal">(optional, only if you want a reply)</span></span>
        <input id="contact" name="contact" class="field" type="email" maxlength="200" autocomplete="email" />
      </label>

      <div class="flex items-center gap-4">
        <button id="submit" type="submit"
                class="px-4 py-2 rounded bg-aired-accent hover:bg-aired-accent-hover text-white text-sm font-medium transition-colors duration-150 disabled:opacity-50">
          Send report
        </button>
        <p id="status" class="text-sm text-aired-text-secondary" role="status" aria-live="polite"></p>
      </div>
    </form>
  </main>

  <footer class="w-full max-w-2xl mx-auto px-6 py-8">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-2xs text-aired-text-tertiary">
      <p>Built by <a href="https://x.com/iammoizfarooq" target="_blank" rel="noopener" class="text-aired-text-secondary hover:text-aired-text-primary transition-colors duration-150">@iammoizfarooq</a></p>
      <a href="https://github.com/progrmoiz/aired" target="_blank" rel="noopener" class="text-aired-text-secondary hover:text-aired-text-primary transition-colors duration-150">GitHub</a>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('report-form');
      var page = document.getElementById('page');
      var status = document.getElementById('status');
      var submit = document.getElementById('submit');

      var preset = new URLSearchParams(location.search).get('id');
      if (preset) page.value = 'https://aired.sh/p/' + preset;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var reason = document.getElementById('reason').value.trim();
        if (!page.value.trim() || !reason) {
          status.textContent = 'Add the page link and a few words on what is wrong.';
          return;
        }
        submit.disabled = true;
        status.textContent = 'Sending…';
        fetch('/api/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: page.value.trim(),
            category: document.getElementById('category').value,
            reason: reason,
            contact: document.getElementById('contact').value.trim() || null
          })
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (res.ok) {
              form.reset();
              status.textContent = 'Thanks. We got your report and will review it.';
            } else {
              status.textContent = data.error || 'Could not send the report. Try again.';
            }
          });
        }).catch(function () {
          status.textContent = 'Could not send the report. Check your connection and try again.';
        }).finally(function () {
          submit.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
