<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aired — sign in the CLI</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/inter-latin-v20.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <!-- Own styles (DESIGN.md tokens), so the page doesn't depend on either site stylesheet. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      font: 15px/1.6 Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0b; color: #ededef;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: 100%; max-width: 42rem; margin: 0 auto; padding: 0 24px; }
    header .wrap { height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-weight: 600; letter-spacing: -0.01em; }
    nav { font-size: 14px; color: #a1a1a6; }
    nav a:hover, .logo:hover { color: #fff; }
    main { flex: 1; padding-top: 40px; padding-bottom: 40px; }
    h1 { font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: -0.02em; }
    h2 { font-size: 18px; line-height: 28px; font-weight: 500; }
    .lede, .muted { margin-top: 8px; font-size: 14px; color: #a1a1a6; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; color: #ededef; }
    .state { margin-top: 32px; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes skeleton-pulse { from { opacity: 1; } to { opacity: 0.4; } }
    .skeleton { height: 16px; width: 14rem; border-radius: 2px; background: #222225; animation: skeleton-pulse 1.2s linear infinite alternate; }
    .skeleton + .skeleton { margin-top: 12px; height: 12px; width: 8rem; }
    form { max-width: 24rem; }
    label { display: block; font-size: 14px; }
    .device-code {
      margin-top: 8px; width: 100%; border-radius: 6px; padding: 8px 12px;
      font: 18px/28px 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.15em; text-transform: uppercase;
      color: #ededef; background: #0a0a0b; border: 1px solid #222225;
    }
    .device-code::placeholder { color: #84848a; }
    .note { margin-top: 12px; font-size: 12px; color: #84848a; }
    .error { margin-top: 12px; font-size: 14px; color: #f87171; }
    .actions { margin-top: 24px; }
    .btn {
      display: inline-flex; align-items: center; border: 0; border-radius: 6px; padding: 10px 16px;
      background: #ededef; color: #0a0a0b; font: 500 14px Inter, sans-serif; cursor: pointer;
      transition: background-color 120ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:hover:not(:disabled) { background: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:focus-visible, .device-code:focus-visible, a:focus-visible, h2:focus-visible { outline: 2px solid #7c6aef; outline-offset: 2px; }
    @media (pointer: coarse) { .btn, .device-code { min-height: 44px; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; opacity: 0.7; } .btn { transition: none; } }
  </style>
</head>
<body>

  <header><div class="wrap">
    <a href="/" class="logo">aired</a>
    <nav><a href="/docs">Docs</a></nav>
  </div></header>

  <main class="wrap">
    <h1>Sign in the aired CLI</h1>
    <p class="lede">Enter the code <code class="mono">aired login --device</code> showed in your terminal.</p>

    <p id="status" class="sr-only" role="status" aria-live="polite"></p>

    <section id="state-loading" class="state" aria-hidden="true">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>

    <section id="state-signed-out" class="state hidden">
      <h2>Sign in first</h2>
      <p class="muted">You come back here to approve the code after you sign in.</p>
      <div class="actions">
        <a id="sign-in" href="/auth/login?return=/device" class="btn">Sign in</a>
      </div>
    </section>

    <section id="state-approve" class="state hidden">
      <form id="approve-form">
        <label for="user-code">Code</label>
        <input id="user-code" name="user_code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
               spellcheck="false" maxlength="9" placeholder="BCDF-GHJK" required class="device-code"
               aria-describedby="who approve-error" />
        <p id="who" class="note"></p>
        <p id="approve-error" class="error hidden" role="alert"></p>
        <div class="actions">
          <button id="approve" type="submit" class="btn">Approve</button>
        </div>
      </form>
    </section>

    <section id="state-done" class="state hidden">
      <h2 tabindex="-1" id="done-heading">The CLI is signed in</h2>
      <p class="muted">Go back to your terminal. You can close this tab.</p>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      function show(id) {
        ['state-loading', 'state-signed-out', 'state-approve', 'state-done'].forEach(function (s) {
          $(s).classList.toggle('hidden', s !== id);
        });
      }
      // Codes look like BCDF-GHJK: no vowels, no 0/O or 1/I.
      function normalize(v) {
        var s = String(v || '').toUpperCase().replace(/[\s-]/g, '');
        return /^[BCDFGHJKLMNPQRSTVWXZ]{8}$/.test(s) ? s.slice(0, 4) + '-' + s.slice(4) : null;
      }
      var fromUrl = normalize(new URLSearchParams(location.search).get('code'));
      var input = $('user-code');
      if (fromUrl) {
        input.value = fromUrl;
        $('sign-in').href = '/auth/login?return=' + encodeURIComponent('/device?code=' + fromUrl);
      }

      function showError(text) {
        $('approve-error').textContent = text || '';
        $('approve-error').classList.toggle('hidden', !text);
        input.setAttribute('aria-invalid', text ? 'true' : 'false');
      }

      fetch('/api/me', { credentials: 'same-origin' })
        .then(function (res) { return res.status === 200 ? res.json() : null; })
        .then(function (user) {
          if (!user || !user.login) { show('state-signed-out'); return; }
          $('who').textContent = 'The CLI will be signed in as @' + user.login + '. Only approve a code you just got from your own terminal.';
          show('state-approve');
          input.focus();
        })
        .catch(function () { show('state-signed-out'); });

      $('approve-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var code = normalize(input.value);
        if (!code) { showError('Codes look like BCDF-GHJK.'); input.focus(); return; }
        var btn = $('approve');
        btn.disabled = true;
        btn.textContent = 'Approving…';
        showError('');
        fetch('/auth/device/approve', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-Aired-Request': '1' },
          body: JSON.stringify({ user_code: code }),
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) { return { ok: res.ok, data: data }; });
          })
          .then(function (r) {
            if (!r.ok) throw new Error(r.data.error || 'Could not approve the code. Please try again.');
            show('state-done');
            $('status').textContent = 'The CLI is signed in. Go back to your terminal.';
            $('done-heading').focus();
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = 'Approve';
            showError(err.message || 'Could not approve the code. Please try again.');
            input.focus();
          });
      });
    })();
  </script>
</body>
</html>
